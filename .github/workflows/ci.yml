name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Verify build
        run: |
          make build

      - name: Run unit & integration tests
        run: |
          go test -v -race -cover ./...

      - name: Test CLI commands
        run: |
          ./bin/tunnelchat help
          ./bin/tunnelchat -c test_user.json new Alice 123456
          ./bin/tunnelchat -c test_user.json --no-stun info
          rm -f test_user.json
